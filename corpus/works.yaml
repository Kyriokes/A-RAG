# Catálogo de obras (PLAN, "Contratos de datos"). Una fila por obra.
#
# - aliases: títulos y abreviaturas en castellano, inglés y latín que usa la detección de
#   obra en las preguntas. Las abreviaturas cortas ("EN", "EE", "Pol.") chocan con palabras
#   comunes ("en"): la detección tiene que distinguir mayúsculas en las abreviaturas.
# - bekker_start / bekker_end: a nivel de columna, derivados del texto griego de Perseus con
#   `python -m app.corpus.work_ranges --write` (no se escriben a mano).
# - authenticity: según el plan, sección "Obras dudosas y espurias". La fuente única que
#   fija la autenticidad se declara en el README (pendiente de la persona).
# - structure: book_chapter, chapter, book_bekker_page o book_problem. El adaptador lee los
#   tipos de división de cada TEI y los mapea a estos niveles.
works:
  - work_id: eth-nic
    abbr: EN
    title_es: Ética a Nicómaco
    title_en: Nicomachean Ethics
    title_la: Ethica Nicomachea
    aliases:
      - Ética a Nicómaco
      - Etica a Nicomaco
      - Ética nicomáquea
      - Ética Nicomaquea
      - Moral a Nicómaco
      - Moral a Nicomaco
      - Nicomachean Ethics
      - Ethics to Nicomachus
      - Ethica Nicomachea
      - EN
      - NE
      - Eth. Nic.
      - EN.
    bekker_start: 1094a
    bekker_end: 1181b
    authenticity: genuine
    structure: book_chapter
    perseus_id: tlg010

