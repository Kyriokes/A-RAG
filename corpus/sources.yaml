# Manifiesto de ediciones (PLAN, "Contratos de datos"). Una fila por edición.
#
# Regla 7 del plan: ningún texto entra al corpus sin una fila con traductor, licencia y
# evidencia. `status`: indexed (entra al índice), reference (solo para derivar Bekker),
# waiting (en espera, con motivo) o excluded (con motivo).
#
# - url y pinned_version: commit fijado de PerseusDL/canonical-greekLit (docs/decisions.md).
# - sha256: lo escribe `make corpus` (app/corpus/fetch.py) en la primera descarga y después
#   se exige; si no coincide, la descarga falla.
# - pub_year: el año de la cabecera TEI (sourceDesc). Donde difiere del plan, se anota.
# - translator_death_year: todos a confirmar (PLAN, "Qué está verificado y qué no").
# - licence_evidence: citas literales de la cabecera TEI de cada archivo (idéntica en los
#   14) y del README del repo en el commit fijado.

x-perseus-evidence: &perseus_evidence >-
  Cabecera TEI del archivo (publicationStmt/availability): <licence
  target="https://creativecommons.org/licenses/by-sa/4.0/">Available under a Creative
  Commons Attribution-ShareAlike (CC BY-SA) license.</licence> y "Reuse must credit the
  Perseus Digital Library in a standard bibliographic format, including a link to
  https://www.perseus.tufts.edu/. Each text reused should be individually identified and
  linked to its source GitHub repository whenever possible, either in its citation or in an
  accompanying source list. All corrections must be offered to the Perseus Digital
  Library." README.md del repo en el commit fijado: "Unless otherwise indicated, all
  contents of this repository are licensed under a Creative Commons Attribution-ShareAlike
  4.0 International License. You must offer Perseus any modifications you make."

